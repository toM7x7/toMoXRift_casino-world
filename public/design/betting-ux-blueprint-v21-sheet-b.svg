<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="gridB" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#153b59" stroke-width="1"/></pattern>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 4L0 0V8Z" fill="#7dd3fc"/></marker>
    <style>.t{font-family:'Yu Gothic','Noto Sans JP',sans-serif;fill:#d9f5ff}.h{font-size:30px;font-weight:700}.s{font-size:17px}.xs{font-size:14px}.line{stroke:#7dd3fc;stroke-width:2;fill:none}.dim{stroke:#7dd3fc;stroke-width:1.4;fill:none;marker-start:url(#arrowB);marker-end:url(#arrowB)}.object{fill:#0d2e46;stroke:#d9f5ff;stroke-width:2}.accent{fill:#164e63;stroke:#67e8f9;stroke-width:2}.action{fill:#3b225d;stroke:#c084fc;stroke-width:2}.info{fill:#552742;stroke:#fb7185;stroke-width:2}.safe{fill:#0e7490;fill-opacity:.2;stroke:#22d3ee;stroke-dasharray:8 6;stroke-width:2}.note{fill:#08243a;stroke:#2e749f;stroke-width:1.5}</style>
  </defs>
  <rect width="1600" height="1000" fill="#061827"/><rect width="1600" height="1000" fill="url(#gridB)"/>
  <text class="t h" x="60" y="54">海賊魔獣ダービー UIUX・観覧デッキ設計図 V21</text>
  <text class="t s" x="60" y="84">SHEET B / 投票所平面・正面・観覧断面　単位: m　操作情報と非操作情報を分離</text>
  <rect x="55" y="104" width="1490" height="3" fill="#67e8f9"/>

  <text class="t h" x="70" y="145">B1 投票所 平面図 1:50</text>
  <g transform="translate(80 190)">
    <rect class="object" width="600" height="500"/>
    <rect class="info" x="145" y="12" width="310" height="64" rx="8"/><text class="t s" x="193" y="39">参加者名簿 2×4（非操作）</text><text class="t xs" x="214" y="62">名前・投票先・枚数</text>
    <rect class="safe" x="62" y="95" width="476" height="236"/><text class="t xs" x="78" y="116">ミニ魔獣選択ゾーン</text>
    <g transform="translate(73 145)"><rect class="accent" width="95" height="78" rx="7"/><circle class="info" cx="48" cy="29" r="19"/><text class="t xs" x="27" y="64">1 紅牙</text></g>
    <g transform="translate(191 145)"><rect class="accent" width="95" height="78" rx="7"/><circle class="info" cx="48" cy="29" r="19"/><text class="t xs" x="27" y="64">2 金角</text></g>
    <g transform="translate(309 145)"><rect class="accent" width="95" height="78" rx="7"/><circle class="info" cx="48" cy="29" r="19"/><text class="t xs" x="27" y="64">3 翠翼</text></g>
    <g transform="translate(427 145)"><rect class="accent" width="95" height="78" rx="7"/><circle class="info" cx="48" cy="29" r="19"/><text class="t xs" x="27" y="64">4 蒼雷</text></g>
    <rect class="action" x="92" y="410" width="180" height="44" rx="6"/><text class="t xs" x="119" y="437">1枚　3枚　5枚</text>
    <rect class="action" x="338" y="410" width="190" height="44" rx="6"/><text class="t xs" x="359" y="437">投票券　発走演出</text>
    <line class="line" x1="45" y1="475" x2="555" y2="475" stroke-dasharray="8 6"/><text class="t xs" x="222" y="494">8人共有の立ち位置</text>
    <line class="dim" x1="0" y1="-22" x2="600" y2="-22"/><text class="t s" x="280" y="-30">12.0</text><line class="dim" x1="-22" y1="0" x2="-22" y2="500"/><text class="t s" transform="translate(-34 270) rotate(-90)">10.0</text>
  </g>

  <text class="t h" x="760" y="145">B2 投票所 正面図 1:40</text>
  <g transform="translate(780 190)">
    <line class="line" x1="0" y1="410" x2="720" y2="410"/>
    <rect class="info" x="145" y="30" width="430" height="105" rx="8"/><text class="t s" x="250" y="61">参加者名簿 / 8 SLOT</text>
    <g class="line"><line x1="145" y1="83" x2="575" y2="83"/><line x1="252" y1="30" x2="252" y2="135"/><line x1="360" y1="30" x2="360" y2="135"/><line x1="468" y1="30" x2="468" y2="135"/></g>
    <g transform="translate(65 192)"><rect class="accent" width="135" height="160" rx="8"/><circle class="info" cx="68" cy="55" r="36"/><text class="t s" x="38" y="122">1 紅牙</text><text class="t xs" x="29" y="146">合計 0枚</text></g>
    <g transform="translate(218 192)"><rect class="accent" width="135" height="160" rx="8"/><circle class="info" cx="68" cy="55" r="36"/><text class="t s" x="38" y="122">2 金角</text><text class="t xs" x="29" y="146">合計 0枚</text></g>
    <g transform="translate(371 192)"><rect class="accent" width="135" height="160" rx="8"/><circle class="info" cx="68" cy="55" r="36"/><text class="t s" x="38" y="122">3 翠翼</text><text class="t xs" x="29" y="146">合計 0枚</text></g>
    <g transform="translate(524 192)"><rect class="accent" width="135" height="160" rx="8"/><circle class="info" cx="68" cy="55" r="36"/><text class="t s" x="38" y="122">4 蒼雷</text><text class="t xs" x="29" y="146">合計 0枚</text></g>
    <line class="dim" x1="65" y1="375" x2="200" y2="375"/><text class="t xs" x="112" y="398">1.9</text>
    <text class="t xs" x="66" y="432">台座全体がInteractable。小さな文字やモデルだけを狙わせない。</text>
  </g>

  <text class="t h" x="70" y="730">B3 投票→観戦 動線図</text>
  <g transform="translate(80 760)">
    <rect class="accent" x="0" y="20" width="180" height="95" rx="10"/><text class="t s" x="38" y="58">投票所</text><text class="t xs" x="30" y="86">選択・掛け金・確定</text>
    <line class="line" x1="180" y1="67" x2="320" y2="67" marker-end="url(#arrowB)"/><text class="t xs" x="215" y="50">10秒演出</text>
    <rect class="action" x="320" y="20" width="180" height="95" rx="10"/><text class="t s" x="356" y="58">観覧デッキ</text><text class="t xs" x="350" y="86">実況・順位・結果</text>
    <line class="line" x1="500" y1="67" x2="640" y2="67" marker-end="url(#arrowB)"/><text class="t xs" x="536" y="50">18秒レース</text>
    <rect class="info" x="640" y="20" width="180" height="95" rx="10"/><text class="t s" x="681" y="58">結果8秒</text><text class="t xs" x="667" y="86">払戻→自動待機</text>
  </g>

  <text class="t h" x="910" y="730">B4 観覧デッキ断面 1:30</text>
  <g transform="translate(900 770)">
    <rect class="object" x="0" y="118" width="250" height="28"/><line class="line" x1="180" y1="70" x2="180" y2="118" stroke-width="5"/><line class="line" x1="180" y1="70" x2="250" y2="70" stroke-width="5"/>
    <text class="t xs" x="147" y="63">上端0.95</text><rect class="object" x="250" y="132" width="380" height="14"/>
    <g transform="translate(385 88)"><circle class="info" cx="0" cy="0" r="20"/><rect class="info" x="-28" y="18" width="56" height="32"/></g>
    <circle class="object" cx="70" cy="30" r="12"/><line class="line" x1="70" y1="42" x2="70" y2="118"/>
    <line class="line" x1="82" y1="30" x2="385" y2="88" stroke-dasharray="7 5"/><text class="t xs" x="182" y="28">視線が手すり上端より上を通る</text>
    <line class="dim" x1="180" y1="160" x2="385" y2="160"/><text class="t xs" x="245" y="184">観覧距離 10m以上</text>
  </g>

  <g transform="translate(900 630)"><rect class="note" width="610" height="70" rx="9"/><text class="t s" x="20" y="29">表示優先度: ①自分の投票 ②発走まで ③先頭 ④確定着順</text><text class="t xs" x="20" y="54">実況音声が出ない端末でも同じ情報を字幕で保証する</text></g>
  <text class="t xs" x="1250" y="976">NEON CASINO / DESIGN REVIEW / 2026-08-15</text>
</svg>
