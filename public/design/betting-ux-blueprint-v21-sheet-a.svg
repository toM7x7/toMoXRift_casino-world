<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="gridA" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#153b59" stroke-width="1"/></pattern>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 4L0 0V8Z" fill="#7dd3fc"/></marker>
    <style>
      .t{font-family:'Yu Gothic','Noto Sans JP',sans-serif;fill:#d9f5ff}.h{font-size:30px;font-weight:700}.s{font-size:17px}.xs{font-size:14px}.line{stroke:#7dd3fc;stroke-width:2;fill:none}.dim{stroke:#7dd3fc;stroke-width:1.4;fill:none;marker-start:url(#arrowA);marker-end:url(#arrowA)}.object{fill:#0d2e46;stroke:#d9f5ff;stroke-width:2}.accent{fill:#164e63;stroke:#67e8f9;stroke-width:2}.action{fill:#3b225d;stroke:#c084fc;stroke-width:2}.safe{fill:#0e7490;fill-opacity:.2;stroke:#22d3ee;stroke-dasharray:8 6;stroke-width:2}.note{fill:#08243a;stroke:#2e749f;stroke-width:1.5}
    </style>
