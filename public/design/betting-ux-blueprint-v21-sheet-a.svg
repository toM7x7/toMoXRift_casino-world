  <g transform="translate(70 720)"><rect class="note" width="620" height="215" rx="10"/>
    <text class="t h" x="24" y="42">UX判定基準</text>
    <text class="t s" x="24" y="78">01　選択面と観戦対象を重ねない</text><text class="t s" x="24" y="108">02　押下領域 1.3×0.65m以上 / 文字高0.18m以上</text>
    <text class="t s" x="24" y="138">03　色だけでなく番号・名称・✓・発光で状態表示</text><text class="t s" x="24" y="168">04　BET後は操作をロックし、自分の投票券を固定表示</text>
