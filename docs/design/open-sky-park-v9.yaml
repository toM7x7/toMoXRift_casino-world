  seated_camera: "卓ごとの席位置へteleportし、移動キーを固定"
  pointer: "着席時にpointer lockを解除"
  desktop_ui: "右側固定。中央から左の3D卓を可視にする"
  compact_ui: "下部シート。XRift固定UIの上に88px安全域を確保"
  players:
