spatial_rules:
  - "遊技広場に壁、天井、横断ゲートを設けない"
  - "広場サインは床面に配置し、着席視線を遮らない"
  - "木、ランタン、掲示板は主要動線6mと交差動線4mの外へ置く"
  - "建設予定地は将来の遊技追加に使える矩形グリッドとして残す"
  - "生成パノラマは有限半径メッシュではなくequirectangular scene.backgroundへ設定する"
  - "XRiftの撮影モードやカメラ位置が変わっても黒い球体境界を出さない"

