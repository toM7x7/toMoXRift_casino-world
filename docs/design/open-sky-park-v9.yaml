    maximum_humans: 4
    blackjack_dealer: "NPC"
    mahjong_empty_seats: "NPC"

acceptance:
  - "サムネイル視点で両遊技広場、中央道路、交換所、2つの建設予定地が同時に読める"
  - "着席視点で床サインや構造物が卓を遮らない"
  - "デスクトップUIが画面右側に留まり、ゲーム操作をクリックできる"
  - "主要通路上に固定コライダーの干渉がない"
  - "実インスタンスで最新sceneUrl、スカイ画像、サムネイルがHTTP 200になる"
