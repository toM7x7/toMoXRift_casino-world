acceptance:
  - "スポーン地点から地図が読め、古い左端看板がない"
  - "椅子をクリックすると選択したENTRY枠が埋まる"
  - "BJ各席は325/347/13/35度で卓中央へ収束し、開始直後に反転しない"
  - "着席中に移動キーを押しても15cm以上離れない"
  - "ESCでマウスカーソルを出さずに卓上3Dボタンを操作できる"
  - "BJのGMカードは公開、自分のカードは本人クライアントだけに描画"
  - "麻雀の私有14牌と操作ボタンが着席視点で読める"

