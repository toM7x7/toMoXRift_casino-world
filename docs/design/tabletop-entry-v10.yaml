project:
  name: "BLOCK RIICHI SKY PARK"
  revision: 10
  objective: "ESC不要の椅子ENTRYと卓上3D操作へ移行する"

spawn_map:
  world_position: [4.2, 0, 9.5]
  yaw_radians: -0.46
  uniform_scale: 0.82
  spawn_position: [0, 0, 18]
  measured_distance_m: 9.49
  collision: "none"
  design_source: "実ワールドの配置JSONから構築するため、生成画像の推測地図は使わない"
