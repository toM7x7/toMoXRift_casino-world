layer_model:
  - layer: "L0"
    name: "3D world"
    contents: ["建物", "卓", "NPC", "交換所", "床誘導線"]
  - layer: "L1"
    name: "world interaction"
    contents: ["近接ボタン", "受付救済", "ゲーム開始"]
  - layer: "L2"
    name: "world HUD"
    contents: ["コイン", "保存状態", "参加者", "目的地"]
  - layer: "L3"
    name: "game dock"
    contents: ["ブラックジャック手札", "麻雀14牌", "操作ボタン"]
  - layer: "L4"
    name: "XRift host chrome"
    contents: ["戻る", "マウスロック", "撮影", "メニュー", "接続状態"]
  z_order_rule: "L4を侵食せず、L2とL3はホスト予約領域の外側へ置く"

host_safe_areas:
