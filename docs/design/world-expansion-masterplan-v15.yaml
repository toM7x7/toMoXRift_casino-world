experience_strategy:
  concept: "OPEN-AIR PIRATE GAME LOOP"
  japanese_concept: "空の下を一周できる海賊遊技村"
  hierarchy:
    - "遠景: Aの巨大運命盤、中央の回転コイン、Bの順位塔で方角を判断"
    - "中景: 色と記号の床ライン、入口旗、低い地区看板で目的地を判断"
    - "近景: 3D操作台と個人HUDで参加状態を判断"
  principles:
    - "壁と屋根を追加しない"
    - "スポーンから全遊技を一度に見せすぎず、三つの遠景ランドマークで奥行きを作る"
    - "行き止まりを作らず、BJ/MJの奥からA/Bへ抜けられる周回路を作る"
    - "既存アセットは入口、GM、境界、報酬の意味を持つ場所へ限定し、装飾の水増しに使わない"
    - "画面UIは個人状態、3D UIは場所と操作を担当する"

