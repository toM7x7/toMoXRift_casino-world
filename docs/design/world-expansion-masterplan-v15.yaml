performance_budget:
  new_unique_gltf_first_pass: 4
  new_unique_gltf_after_profile_max: 7
  animated_palms: 4
  simultaneous_racers: 4
  additional_animated_flags: 2
  additional_dynamic_lights: 0
  maximum_simultaneous_particles: 96
  shadow_policy:
    new_racers: "castShadow false、receiveShadow false"
    new_small_props: "castShadow false"
    existing_gm: "近距離だけ影"
  load_policy:
    - "スポーン時は既存共通資産と案内だけ優先"
    - "A/B新規モデルは最初の描画後にプリロード"
    - "4属性別モデルは実機計測でロード時間とGPU負荷を通過した場合だけ採用"

collider_policy:
  keep: "56m×42m床面と外周固定CuboidCollider"
  routes: "床面Colliderを共有し、装飾道路へ追加Colliderを置かない"
  area_a: "回転盤の土台と投票席だけ固定cuboid。回転する装飾モデルを物理Colliderにしない"
  area_b: "競走盤土台、観戦レール、順位塔だけ固定cuboid。レーサーはColliderなし"
  props: "樽、旗、ロープ、木箱は原則非衝突。主要動線から0.45m以上離す"

implementation_architecture:
  proposed_components:
    - file: "src/components/WorldNavigation.tsx"
      responsibility: "主軸・横断路・北側回遊路・床ライン・スポーン地図。v15 JSONだけから位置を読む"
    - file: "src/components/CaptainsFateWheel.tsx"
      responsibility: "Aの空間、投票席、同期状態、結果。配当仕様承認まで精算処理を接続しない"
    - file: "src/components/MonsterDerby.tsx"
      responsibility: "Bの競走盤、ENTRY、同期着順、手続き移動、精算"
    - file: "src/components/PirateNationExpansionAssets.tsx"
      responsibility: "Wooden Helm、旗、木箱、Hippogriffを選択的に読み込む"
    - file: "src/components/CasinoHud.tsx"
      responsibility: "CasinoEconomy.tsxから表示だけ分離し、コインデータ経路を変えずにHUDを整理"
  state_keys:
    area_a: "casino.fateWheel.session.v1"
    area_b: "casino.derby.session.v1"
    wallet: "casino.coins.v1"
  feature_gates:
    area_a_enabled_default: false
    area_b_enabled_default: false
    fallback: "無効時は現在のFuturePlotを表示"
    review_modes: ["?mode=masterplan", "?mode=fate-wheel", "?mode=derby"]
    production_rule: "個別QAを通過した区画だけ有効化できる。A/B同時公開を必須にしない"
  rollback_units:
    - "navigation-and-hud"
    - "north-routes-and-grayboxes"
    - "area-b-gameplay"
    - "area-a-gameplay"
    - "asset-integration"
  economy_boundary: "CasinoEconomyProviderとcasino.coins.v1を維持し、HUD整理とゲーム追加を同じ変更で書き換えない"

update_strategy:
  - phase: 0
    name: "設計承認"
    writes_runtime: false
    deliverables: ["マスタープラン", "UIUX図", "アセット流用表", "A/B個別仕様"]
    exit_gate: "地図、回遊路、A/B役割、HUD整理を承認"
  - phase: 1
    name: "基準統合と案内更新"
    scope: ["v15 JSONを唯一の寸法原本へ", "道路とデッキの数値ずれ解消", "スポーン地図移設", "HUD重複削除"]
    risk: "low"
    exit_gate: "既存BJ/MJ/受付を壊さず、スポーンから5地区を理解できる"
  - phase: 2
    name: "全体回遊路とA/B灰色箱"
    scope: ["北側回遊路", "左右リンク", "A回転盤灰色箱", "B競走盤灰色箱", "固定Collider"]
    risk: "medium"
    exit_gate: "全周歩行、段差、視線、通路幅、外周落下を実機確認"
  - phase: 3
    name: "Bダービー同期PoC"
    scope: ["1〜4人ENTRY", "seed着順", "手続き移動", "1/3/5枚", "払戻"]
    risk: "high"
    exit_gate: "同一インスタンス全員の着順一致と二重精算QA"
  - phase: 4
    name: "A運命盤ゲーム仕様・同期PoC"
    scope: ["投票席", "1/3/5枚", "抽選", "総取りまたは固定配当の最終選定"]
    risk: "high"
    exit_gate: "ソロ時の面白さ、複数人端数、切断精算を承認"
  - phase: 5
    name: "既存資産統合と演出"
    scope: ["Wooden Helm", "旗", "木箱", "Hippogriff", "音", "低負荷粒子"]
    risk: "medium"
    exit_gate: "PC/モバイルのロード、FPS、視認性を通過"
  - phase: 6
    name: "総合QA・撮影・リリース"
    scope: ["実インスタンス1〜4人", "全ゲーム離席", "HUDクリック", "World Storage", "サムネイル", "CDN"]
    risk: "high"
    exit_gate: "技術PASSとビジュアルPASSを別々に記録後、GitHub同期とXRift upload"

change_management:
  branch_policy: "設計ファイルを先に確定し、実装はnavigation、graybox、B、A、assetsの小さな差分へ分ける"
  commit_policy:
    - "1コミットで既存ゲームロジックと新ゲームロジックを同時変更しない"
    - "地図・HUDの変更とWorld Storage残高処理を同じコミットで変更しない"
    - "アセット取込コミットには出典、CC0、元パス、変換内容、ファイルサイズを記録"
  screenshot_matrix:
    - "spawn-desktop"
    - "spawn-compact"
    - "blackjack-entry-and-leave"
    - "mahjong-entry-discard-call-win-leave"
    - "fate-wheel-entry-spin-result-leave"
    - "derby-entry-race-result-leave"
    - "overview-thumbnail"
  release_policy: "A/B、既存ゲーム、受付、HUDの実インスタンス確認が揃うまでuploadしない。片側だけ合格した場合はfeature gateで片側公開を選べる"

acceptance:
  map_and_space:
    - "スポーン5秒以内に地図、主軸、三つの遠景ランドマークを認識できる"
    - "A/Bを含む全地区へ幅2.4m以上のルートで到達できる"
    - "BJ/MJの北側からA/Bへ抜けられ、行き止まりにならない"
    - "新規看板、旗、小物が主動線またはゲーム視線を塞がない"
  uiux:
    - "固定HUDはコインと参加者だけを主役にする"
