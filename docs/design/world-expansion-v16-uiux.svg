  <g><circle cx="1260" cy="635" r="8" fill="#4aaeb6"/><circle cx="1205" cy="650" r="8" fill="#95683f"/><circle cx="1285" cy="665" r="8" fill="#e2583c"/><circle cx="1170" cy="680" r="8" fill="#3f68d0"/></g>
  <text x="830" y="720" class="t small">手元：現在順位と残距離。映像を複製せず、物理トークンで遠景の読みにくさだけを補う。</text>

  <rect x="60" y="775" width="1475" height="155" rx="10" class="p"/>
  <text x="85" y="815" class="t c h mid">共通インタラクション</text>
