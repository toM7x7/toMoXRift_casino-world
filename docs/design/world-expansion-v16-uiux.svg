<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#173646"/></pattern><style>.t{font-family:'Yu Gothic UI','Noto Sans JP',sans-serif;fill:#f4fbff}.h{font-weight:800}.c{fill:#55d7ff}.p{fill:#0e2735;stroke:#b9d8e8;stroke-width:2}.gold{fill:#ffc34f}.small{font-size:18px}.mid{font-size:23px}.big{font-size:30px}.line{stroke:#b9d8e8;stroke-width:2;fill:none}.dash{stroke:#b9d8e8;stroke-width:2;stroke-dasharray:8 6;fill:none}</style></defs>
  <rect width="1600" height="1000" fill="#071a26"/><rect x="25" y="25" width="1550" height="950" fill="url(#g)"/>
  <text x="65" y="75" class="t h big">v16 観戦UIUX｜視界をゲーム本体、手元を操作と補助情報へ</text>
  <text x="65" y="108" class="t small">大きな固定HUDなし / pointer lockなし / ESC不要 / 日本語＋色＋番号＋記号</text>

  <rect x="60" y="145" width="710" height="600" rx="10" class="p"/><text x="85" y="185" class="t c h mid">A｜船長の運命盤　着席時の視界</text>
