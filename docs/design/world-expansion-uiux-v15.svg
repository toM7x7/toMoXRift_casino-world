<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#18384b"/></pattern><style>text{font-family:"Noto Sans JP","Yu Gothic UI","Segoe UI",sans-serif;fill:#fff7e6}.title{font-size:32px;font-weight:900}.head{font-size:22px;font-weight:900;fill:#63d7f2}.label{font-size:17px;font-weight:900}.small{font-size:14px}.micro{font-size:12px}.panel{fill:#13283a;stroke:#69717d;stroke-width:3}.screen{fill:#101927;stroke:#d7eef6;stroke-width:3}.good{fill:#2f7d62}.warn{fill:#8f5d2d}.remove{fill:#723b4d}.world{fill:#315c72}.ui3d{fill:#805d34}.hud{fill:#3157ad}.gold{fill:#9a6b1f}</style></defs>
  <rect width="1600" height="1000" fill="#081824"/><rect x="35" y="35" width="1530" height="930" fill="url(#grid)"/>
  <text class="title" x="75" y="88">ブロック遊技村 v15｜UIUX責務・画面安全域・導線設計</text>
  <text class="small" x="75" y="118">目的: 情報を減らすのではなく、場所・操作・個人状態を正しい層へ戻す</text>

  <text class="head" x="75" y="170">1. 情報の担当</text>
  <g transform="translate(75 195)">
    <rect class="panel" width="450" height="230"/><rect class="world" x="20" y="20" width="410" height="55"/><text class="label" x="40" y="55">空間・地図</text><text class="small" x="170" y="55">場所 / 方角 / 入口 / 人数</text>
    <rect class="ui3d" x="20" y="88" width="410" height="55"/><text class="label" x="40" y="123">3D操作盤</text><text class="small" x="170" y="123">参加 / 賭け / 選択 / 取消</text>
    <rect class="hud" x="20" y="156" width="410" height="55"/><text class="label" x="40" y="191">個人HUD</text><text class="small" x="170" y="191">自分の残高 / 状態 / 通知</text>
  </g>
  <g transform="translate(555 195)">
    <rect class="panel" width="440" height="230"/><text class="label" x="22" y="38">削除・縮小するもの</text>
    <rect class="remove" x="22" y="56" width="396" height="40"/><text class="small" x="38" y="82">上中央の固定「BJ / 受付 / MJ」ナビ</text>
    <rect class="remove" x="22" y="108" width="396" height="40"/><text class="small" x="38" y="134">左下の機能を持たない疑似ホットバー</text>
    <rect class="warn" x="22" y="160" width="396" height="40"/><text class="small" x="38" y="186">常駐通知 → 3.5秒トースト</text>
  </g>
  <g transform="translate(1025 195)">
    <rect class="panel" width="500" height="230"/><text class="label" x="22" y="38">残す・強化するもの</text>
    <rect class="good" x="22" y="56" width="456" height="40"/><text class="small" x="38" y="82">左上コイン＋保存状態</text>
    <rect class="good" x="22" y="108" width="456" height="40"/><text class="small" x="38" y="134">折り畳み参加者一覧</text>
    <rect class="good" x="22" y="160" width="456" height="40"/><text class="small" x="38" y="186">ゲーム接近時だけ出る文脈バー</text>
  </g>

  <text class="head" x="75" y="475">2. デスクトップ安全域と視界</text>
  <g transform="translate(75 500)">
    <rect class="screen" width="900" height="430" rx="8"/>
    <rect x="0" y="0" width="900" height="68" fill="#5b3c76" opacity="0.58"/><text class="micro" x="365" y="34">XRift上部固定UI / 触らない</text>
    <rect class="panel" x="18" y="84" width="208" height="108"/><rect x="34" y="100" width="34" height="34" fill="#f6c453"/><text class="small" x="82" y="116">コイン</text><text x="82" y="150" font-size="25" font-weight="900" fill="#f6c453">24枚</text><text class="micro" x="34" y="178">保存済み / 参加者▼</text>
    <rect class="panel" x="642" y="84" width="240" height="290"/><text class="label" x="666" y="118">海賊魔獣ダービー</text><text class="small" x="666" y="152">投票済 3枚 / 2号</text><rect class="gold" x="666" y="178" width="192" height="48"/><text class="label" x="712" y="208">取消</text><text class="micro" x="666" y="264">参加中のみ表示</text>
    <rect x="245" y="84" width="378" height="290" fill="#315c72" opacity="0.45" stroke="#63d7f2" stroke-width="2" stroke-dasharray="10 6"/><text class="label" x="340" y="228">3Dゲーム対象を空ける</text><text class="small" x="335" y="256">中央約60%に大型UIを置かない</text>
    <rect class="panel" x="300" y="386" width="300" height="32"/><text class="small" x="343" y="407">受付中 12秒 / 近接時だけ</text>
    <text class="micro" x="18" y="414">通知は左下トースト、3.5秒後に消える</text>
  </g>

  <text class="head" x="1030" y="475">3. モバイル / コンパクト</text>
  <g transform="translate(1080 500)">
    <rect class="screen" width="360" height="430" rx="24"/>
    <rect x="0" y="0" width="360" height="62" fill="#5b3c76" opacity="0.58"/><text class="micro" x="110" y="34">XRift上部固定UI</text>
    <rect class="panel" x="12" y="76" width="196" height="82"/><text class="small" x="28" y="102">コイン</text><text x="28" y="137" font-size="25" font-weight="900" fill="#f6c453">24枚</text>
    <rect x="12" y="170" width="336" height="104" fill="#315c72" opacity="0.45" stroke="#63d7f2" stroke-dasharray="8 5"/><text class="small" x="92" y="226">3D対象の視界を確保</text>
    <rect class="panel" x="12" y="286" width="336" height="56"/><text class="small" x="72" y="320">投票済 3枚 / 2号</text>
    <rect x="0" y="342" width="360" height="88" fill="#5b3c76" opacity="0.6"/><text class="micro" x="102" y="391">XRift下部 88px安全域</text>
  </g>

  <rect class="panel" x="75" y="945" width="1450" height="36"/><text class="small" x="95" y="969">着席共通: pointer lock不要 / 常時離席 / Xキー / 席再クリック / 離席完了時に移動キーを即時解放</text>
</svg>
